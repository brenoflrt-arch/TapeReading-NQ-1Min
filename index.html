<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TapeReading NQ — Estrutura</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topo">
  <button class="botao-som" id="botao-som" type="button">🔈 Ativar som</button>
  <div class="status" id="status">conectando…</div>
</header>

<!-- Pedido de 2026-08-11: reduzido a UM único card -- performance do Registros (Resultado
     Análise), em pontos, sem operação/preço/horário/nível de nenhuma operação. O restante da
     página (ticker de preço, tabelas linha-a-linha de Registros/Operações/MNQ, cards de
     Operações e MNQ) foi removido -- o Supabase também não aceita mais leitura pública das
     tabelas cruas (só a view registros_performance_publica, sem dado identificável, ver
     supabase_bloquear_dados_publicos.sql). -->
<main class="protegido-total" id="protegido-total" data-bloqueado="true">
  <div class="conteudo-protegido">
  <section class="cartao cartao-performance">
    <div class="performance-tira">
      <div class="tira-item">
        <span class="tira-rotulo">Resultado total</span>
        <span class="tira-valor valor-borrado" id="perf-resultado-total-2">—</span>
      </div>
      <div class="tira-item">
        <span class="tira-rotulo">Lucro bruto</span>
        <span class="tira-valor valor-borrado" id="perf-lucro-bruto-2">—</span>
      </div>
      <div class="tira-item">
        <span class="tira-rotulo">Prejuízo bruto</span>
        <span class="tira-valor valor-borrado" id="perf-prejuizo-bruto-2">—</span>
      </div>
      <div class="tira-item">
        <span class="tira-rotulo">Operações</span>
        <span class="tira-valor" id="perf-operacoes-2">—</span>
      </div>
      <div class="tira-item">
        <span class="tira-rotulo">Vencedoras</span>
        <span class="tira-valor" id="perf-vencedoras-2">—</span>
      </div>
      <div class="tira-item">
        <span class="tira-rotulo">Operações positivas</span>
        <span class="tira-valor" id="perf-operacoes-positivas-2">—</span>
      </div>
      <div class="tira-item">
        <span class="tira-rotulo">Operações negativas</span>
        <span class="tira-valor" id="perf-operacoes-negativas-2">—</span>
      </div>
    </div>

    <div class="performance-abas" id="performance-abas-2">
      <button class="aba-periodo aba-periodo-2" data-periodo="diario" type="button">Diário</button>
      <button class="aba-periodo aba-periodo-2" data-periodo="semanal" type="button">Semanal</button>
      <button class="aba-periodo aba-periodo-2" data-periodo="mensal" type="button">Mensal</button>
      <button class="aba-periodo aba-periodo-2 aba-periodo-ativa" data-periodo="total" type="button">Todo período</button>
    </div>

    <p class="performance-titulo-grafico">Patrimônio</p>
    <svg id="grafico-patrimonio-2" class="grafico-patrimonio" viewBox="0 0 900 340" preserveAspectRatio="none"></svg>
  </section>
  </div>

  <div class="bloqueio-login-total" id="bloqueio-login">
    <form id="form-login" class="form-login">
      <span class="bloqueio-titulo">Área restrita</span>
      <input type="email" id="login-email" placeholder="e-mail" autocomplete="username" required />
      <input type="password" id="login-senha" placeholder="senha" autocomplete="current-password" required />
      <button type="submit">Entrar</button>
      <span class="bloqueio-erro" id="bloqueio-erro"></span>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
